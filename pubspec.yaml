name: zart
version: 3.0.0
description: >-
  A multi-engine, multi-platform library for playing Interactive Fiction (IF) games.
  Zart is a modern, multi-platform interpreter library, supporting Z-Machine,
  Inform 6/7, and TADS 3.  It also provides a unified API that allows you to build
  your own player for any platform that Flutter/Dart runs on.  
homepage: https://atebitftw.github.io/site/
repository: https://github.com/atebitftw/zart
issue_tracker: https://github.com/atebitftw/zart/issues
platforms:
  web:
  windows:
  linux:
  macos:
  android:
  ios:
topics:
  - zmachine
  - interactive-fiction
  - zork
environment:
  sdk: ^3.10.4
dependencies:
  logging: ^1.3.0
  args: ^2.7.0
dev_dependencies:
  test: ^1.28.0
  lints: ^6.0.0